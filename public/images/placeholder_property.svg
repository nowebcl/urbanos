<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <circle cx="400" cy="270" r="220" fill="url(#glow)" />

  <!-- Grid lines pattern for architectural feel -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 8" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="250" y1="0" x2="250" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
  </g>

  <!-- Central House & Camera Icon Badge -->
  <g transform="translate(400, 240)">
    <!-- Badge circle -->
    <circle cx="0" cy="0" r="54" fill="#0b1329" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="48" fill="#0f172a" />

    <!-- Stylized House Graphic -->
    <path d="M-24,6 L0,-16 L24,6 L18,6 L18,22 L6,22 L6,12 L-6,12 L-6,22 L-18,22 L-18,6 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Sun/Key point -->
    <circle cx="12" cy="-8" r="3" fill="#f97316" />
  </g>

  <!-- Typography -->
  <text x="400" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="3">
    URBANOS INMOBILIARIA
  </text>
  <text x="400" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="1">
    Fotografía en Preparación
  </text>
  
  <!-- Subtle decorative pill -->
  <g transform="translate(340, 410)">
    <rect width="120" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#10b981" />
    <text x="64" y="16" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#cbd5e1" letter-spacing="1">
      CATÁLOGO 2026
    </text>
  </g>
</svg>
